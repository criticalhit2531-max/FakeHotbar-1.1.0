
name: Build Fake Hotbar

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          echo "Searching for Gradle project..."

          PROJECT_FILE=$(find . -type f -name "settings.gradle" \
            -not -path "*/.gradle/*" | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find . -type f -name "build.gradle" \
              -not -path "*/.gradle/*" | head -n 1)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Gradle project not found!"
            echo "Repository file structure:"
            find . -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Gradle project found: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Fake Hotbar
        run: gradle --no-daemon -p "${{ steps.project.outputs.project_dir }}" clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: FakeHotbar-1.1.0
          path: |
            **/build/libs/fakehotbar-1.1.0.jar
          if-no-files-found: error
          retention-days: 30
